[project]
name = "slack-news-sumbot"
version = "0.1.0"
description = "Slack 채널의 전날 뉴스를 AI로 요약하여 매일 아침 자동 포스팅하는 봇"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.84.0",
    "beautifulsoup4>=4.14.3",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "slack-sdk>=3.40.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
